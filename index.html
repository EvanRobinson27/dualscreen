<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>DualScreen</title>
  <meta name="theme-color" content="#0c0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DualScreen">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="lib">
    <header class="lib-head">
      <svg class="mark" viewBox="0 0 44 44" aria-hidden="true">
        <rect x="9" y="2" width="26" height="19" rx="3.5" fill="#e8b04b"/>
        <rect x="9" y="23" width="26" height="19" rx="3.5" fill="#eceae4"/>
        <rect x="13" y="6" width="18" height="11" rx="1.5" fill="#1a1408"/>
        <rect x="13" y="27" width="18" height="11" rx="1.5" fill="#1a1408"/>
      </svg>
      <h1>DualScreen<small id="count">Your library</small></h1>
      <button class="btn icon" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="btn primary" id="addBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add game
      </button>
      <input type="file" id="fileInput" accept=".nds,.zip,.7z,application/octet-stream" multiple hidden>
    </header>

    <div class="install-tip hidden" id="installTip">
      <span>To install: tap <b>Share</b> then <b>Add to Home Screen</b>. It'll open fullscreen like a regular app.</span>
      <button id="dismissTip" aria-label="Dismiss">×</button>
    </div>

    <section class="grid" id="grid"></section>

    <section class="empty hidden" id="empty">
      <svg width="92" height="92" viewBox="0 0 44 44" aria-hidden="true" style="opacity:.9">
        <rect x="9" y="2" width="26" height="19" rx="3.5" fill="#2a2e37"/>
        <rect x="9" y="23" width="26" height="19" rx="3.5" fill="#2a2e37"/>
        <rect x="13" y="6" width="18" height="11" rx="1.5" fill="#0c0d10"/>
        <rect x="13" y="27" width="18" height="11" rx="1.5" fill="#0c0d10"/>
      </svg>
      <h2>No games yet</h2>
      <p>Add your .nds game files from the Files app. They're stored on this iPad, so you only add each one once.</p>
      <button class="btn primary" id="emptyAdd">Add game</button>
    </section>
  </main>

  <script src="js/db.js"></script>
  <script src="js/nds.js"></script>
  <script src="js/library.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
